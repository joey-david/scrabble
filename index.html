<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#254d42">
  <meta name="description" content="A quiet place to play French and English Scrabble with friends. Up to eight players, live rooms, and checked words.">
  <title>Scrabble · Joey David</title>
  <link rel="stylesheet" href="/scrabble/style.css">
  <script src="/scrabble/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/scrabble/" aria-label="Scrabble home"><span class="brand-tile">S<small>1</small></span><span>scrabble<span class="byline">chez Joey</span></span></a>
    <nav aria-label="Tools"><button id="help" class="quiet">?</button><div class="language-switch"><button data-locale="fr" aria-label="Interface en français">FR</button><button data-locale="en" aria-label="Interface in English">EN</button></div></nav>
  </header>
  <main>
    <section id="welcome" class="welcome">
      <div class="intro"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="headline"></h1><p data-i18n="intro"></p><div class="sample-tiles" aria-hidden="true"><span>J<small>8</small></span><span>O<small>1</small></span><span>U<small>1</small></span><span>E<small>1</small></span><span>R<small>1</small></span></div><p class="fine" data-i18n="roomHint"></p></div>
      <form id="join-form" class="card join-card"><p class="eyebrow" data-i18n="takeSeat"></p><h2 id="join-title" data-i18n="joinLobby"></h2><label for="name" data-i18n="name"></label><input id="name" name="name" maxlength="24" required autocomplete="nickname" placeholder="Joey"><div class="photo-row"><span id="photo-preview" class="avatar large">J</span><div><label class="file-label" for="photo" data-i18n="choosePhoto"></label><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"><button id="remove-photo" type="button" class="quiet" data-i18n="removePhoto" hidden></button><p class="fine" data-i18n="photoHint"></p></div></div><button type="submit" class="primary" id="join-button" data-i18n="joinLobby"></button><button type="button" class="quiet" id="create-room" data-i18n="privateRoom"></button><p class="fine" data-i18n="noAccount"></p></form>
    </section>
    <section id="room" hidden>
      <div class="room-heading"><div><p class="eyebrow" id="room-code"></p><h1 id="room-title"></h1></div><div class="room-tools"><button id="invite" class="secondary" data-i18n="invite"></button><button id="leave" class="quiet" data-i18n="leave"></button></div></div>
      <section id="lobby" class="lobby-layout"><div class="card seats-card"><div class="card-heading"><h2 data-i18n="players"></h2><span id="player-count" class="badge"></span></div><div id="lobby-players" class="seats"></div><p id="host-note" class="fine"></p></div><form id="settings-form" class="card settings-card"><div class="card-heading"><h2 data-i18n="settings"></h2><span id="host-badge" class="badge"></span></div><fieldset id="settings-fields"><label for="game-language" data-i18n="dictionary"></label><select id="game-language"><option value="fr">Français · ODS9</option><option value="en">English · CSW24</option></select><div class="setting-pair"><div><label for="minutes" data-i18n="playerTime"></label><select id="minutes"><option value="0" data-i18n="unlimited"></option><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="20">20 min</option><option value="30">30 min</option><option value="45">45 min</option><option value="60">60 min</option></select></div><div><label for="turn-seconds" data-i18n="turnTime"></label><select id="turn-seconds"><option value="0" data-i18n="unlimited"></option><option value="30">30 s</option><option value="60">60 s</option><option value="90">90 s</option><option value="120">120 s</option><option value="180">180 s</option><option value="300">300 s</option></select></div></div><label class="checkbox"><input id="random-first" type="checkbox" checked><span data-i18n="randomFirst"></span></label><label class="checkbox"><input id="show-preview" type="checkbox" checked><span data-i18n="previewOption"></span></label></fieldset><p class="fine" data-i18n="clockHint"></p><div class="settings-actions"><button id="save-settings" class="secondary" type="submit" data-i18n="saveSettings"></button><button id="start" class="primary" type="button" data-i18n="start"></button></div><p id="dictionary-note" class="fine"></p></form></section>
      <section id="game" class="game-layout" hidden><div class="play-area"><div class="turn-bar"><div><span class="status-dot"></span><strong id="turn-label"></strong><span id="turn-clock" class="clock"></span></div><div><button id="direction" class="quiet" aria-label="Placement direction">→</button><button id="zoom" class="quiet" data-i18n="zoom"></button></div></div><div id="board-scroll" class="board-scroll"><div id="board" class="board" role="group" aria-label="Scrabble board"></div></div><div class="board-legend"><span class="legend-dl" id="legend-dl"></span><span class="legend-tl" id="legend-tl"></span><span class="legend-dw" id="legend-dw"></span><span class="legend-tw" id="legend-tw"></span></div><div class="rack-panel"><div class="rack-heading"><strong data-i18n="yourRack"></strong><span id="bag-count" class="fine"></span></div><div id="rack" class="rack" role="group" aria-label="Your tiles"></div><div class="rack-tools"><button id="reorder-left" class="quiet" aria-label="Move selected tile left">←</button><button id="reorder-right" class="quiet" aria-label="Move selected tile right">→</button><button id="shuffle" class="quiet" data-i18n="shuffle"></button><button id="sort" class="quiet" data-i18n="sort"></button><button id="recall" class="quiet" data-i18n="recall"></button><button id="return-tile" class="quiet" data-i18n="returnTile"></button></div><p id="move-preview" class="move-preview" aria-live="polite"></p><div class="play-actions"><button id="play" class="primary" data-i18n="play"></button><button id="exchange" class="secondary" data-i18n="exchange"></button><button id="pass" class="quiet" data-i18n="pass"></button></div><p class="fine controls-hint" data-i18n="controlsHint"></p></div></div><aside class="game-sidebar"><section class="card"><div class="card-heading"><h2 data-i18n="scores"></h2><span id="game-language-badge" class="badge"></span></div><div id="score-players"></div><div id="finished" hidden><h2 data-i18n="gameOver"></h2><p id="winner"></p><p id="end-reason" class="fine"></p><button id="rematch" class="primary" data-i18n="rematch"></button></div><button id="resign" class="quiet" data-i18n="resign"></button></section><section class="card history-card"><div class="card-heading"><h2 data-i18n="lastMoves"></h2><span class="fine" data-i18n="definitions"></span></div><div id="history" class="history"></div></section></aside></section>
    </section>
    <p id="connection" class="connection" role="status" hidden></p>
    <p id="notice" class="notice" role="status" hidden></p>
  </main>
  <footer><span data-i18n="footer"></span><a href="https://github.com/joey-david/scrabble">GitHub ↗</a></footer>
  <dialog id="modal"><button id="modal-close" class="dialog-close" aria-label="Close">×</button><div id="modal-content"></div></dialog>
</body>
</html>
